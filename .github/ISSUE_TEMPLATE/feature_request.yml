name: Feature request
description: Propose a focused improvement for DesignShelf
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What design workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the idea.
    validations:
      required: true
  - type: textarea
    id: local
    attributes:
      label: Local-first considerations
      description: Does this affect privacy, storage, backups, or asset licensing?

